services:
  app:
  
    build: .
    ports:
      - "8086:8086"
    env_file:
     - .env.local
    depends_on:
      db:
        condition: service_healthy

  db:                         # ← теперь внутри services
    image: postgres:16-alpine
    env_file:
      - .env.local
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U myuser -d mydatabase" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: